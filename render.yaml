services:
  - type: web
    name: ras-assessment-api
    runtime: docker
    plan: free
    region: ohio
    repo: https://github.com/souravC01/RAS-Assesment
    branch: feat/site-safety
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: DEMO_SEED_ENABLED
        value: "true"
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_FRAMER_A_PASSWORD
        sync: false
      - key: DEMO_FRAMER_B_PASSWORD
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: images
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
  - type: web
    name: ras-assessment
    runtime: static
    repo: https://github.com/souravC01/RAS-Assesment
    branch: feat/site-safety
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ras-assessment-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
